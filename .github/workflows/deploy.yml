name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : la page /nouveautes/ et son flux RSS se lisent dans git
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache des images optimisées et des cartes de partage
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/lib/og.ts', 'src/data/vehicles/**') }}
          restore-keys: astro-assets-

      - run: npm run lint:typo

      - run: npm run build

      # Pages nouvelles ou modifiées par rapport au site en ligne, signalées après le déploiement
      - name: IndexNow, pages à signaler
        continue-on-error: true
        run: node scripts/indexnow.mjs --out indexnow.json

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: indexnow
          path: indexnow.json
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: indexnow

      - name: IndexNow (Bing, Yandex, Seznam)
        continue-on-error: true
        run: |
          if [ -s indexnow.json ]; then
            curl -sS -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
          else
            echo "Aucune page à signaler."
          fi
